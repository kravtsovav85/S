<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Меню | Алексей Кравцов</title><meta name="robots" content="noindex"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
    #ak-bot-five{padding:4px 12px;--ak-paper:light-dark(#f7f6f1,#18231e);--ak-ink:light-dark(#20372d,#eef2e9);--ak-muted:light-dark(#5b675f,#b4c1b7);--ak-white:light-dark(#ffffff,#24352b);--ak-copper:light-dark(#996442,#d3a580);--ak-line:light-dark(#dce3da,#405448);--tg-bg:light-dark(#dce8e6,#14211d);--tg-header:light-dark(#fff,#20312a);font-family:Arial,sans-serif;color:var(--ak-ink)}
    #ak-bot-five .phone{max-width:390px;margin:auto;background:var(--tg-bg);border:1px solid var(--ak-line);border-radius:24px;overflow:hidden;box-shadow:0 12px 32px light-dark(#20372d16,#00000038)}
    #ak-bot-five .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--tg-header);border-bottom:1px solid var(--ak-line)}
    #ak-bot-five .bar strong{display:block;font-weight:500;font-size:14px}#ak-bot-five .bar small{display:block;font-size:12px;color:var(--ak-muted);margin-top:3px}
    #ak-bot-five .conversation{padding:18px 14px 22px}#ak-bot-five .bubble{padding:18px;background:var(--ak-white);border-radius:14px;margin-bottom:10px}#ak-bot-five p{font-size:14px;line-height:1.55;margin:0 0 12px}#ak-bot-five p:last-child{margin:0}
    #ak-bot-five .chat-actions{display:grid;gap:6px}#ak-bot-five button,#ak-bot-five a.action{font:inherit;font-size:14px;line-height:1.35;cursor:pointer;text-decoration:none}#ak-bot-five .chat-actions button{border:0;background:var(--ak-white);color:var(--ak-ink);padding:13px 12px;border-radius:9px;min-height:46px;text-align:center}#ak-bot-five .chat-actions button.primary{background:var(--ak-ink);color:var(--ak-paper)}
    #ak-bot-five .composer{display:flex;align-items:center;gap:9px;padding:12px;background:var(--tg-header);border-top:1px solid var(--ak-line)}#ak-bot-five .menu-launch{background:var(--ak-ink);color:var(--ak-paper);border:0;border-radius:18px;padding:9px 12px;white-space:nowrap;min-height:42px}#ak-bot-five .message-hint{flex:1;color:var(--ak-muted);font-size:13px;min-width:0}#ak-bot-five .send{border:0;background:none;color:var(--ak-copper);padding:8px;min-height:40px;font-size:20px}
    #ak-bot-five .app{background:var(--ak-paper)}#ak-bot-five .app-content{padding:14px 20px 12px}#ak-bot-five .wordmark{font-family:Georgia,serif;font-size:18px;line-height:1.05;padding-bottom:7px;border-bottom:2px solid var(--ak-copper);display:inline-block;margin-bottom:8px}#ak-bot-five .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ak-copper);margin-bottom:10px}#ak-bot-five h2{font-family:Georgia,serif;font-weight:400;font-size:29px;line-height:1.12;letter-spacing:-.025em;margin:0 0 10px}#ak-bot-five .credentials{font-size:12px;line-height:1.55;color:var(--ak-muted);padding:8px 0;border-top:1px solid var(--ak-line);margin:8px 0 10px}
    #ak-bot-five .app-menu{display:grid;gap:7px}#ak-bot-five .app-menu button{background:var(--ak-white);border:1px solid var(--ak-line);border-radius:12px;padding:9px 12px;color:var(--ak-ink);display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;min-height:48px}#ak-bot-five .app-menu button small{display:block;color:var(--ak-muted);font-size:12px;margin-top:4px}#ak-bot-five .app-menu .cta{background:var(--ak-ink);color:var(--ak-paper);text-align:center;display:block;min-height:48px}#ak-bot-five .quiet{display:flex;justify-content:space-between;gap:12px;margin-top:4px;flex-wrap:wrap}#ak-bot-five .quiet button,#ak-bot-five .back,#ak-bot-five .close{padding:8px 0;border:0;background:none;color:var(--ak-muted);font-size:13px;min-height:36px}#ak-bot-five .detail{padding:0 0 6px}#ak-bot-five .detail h2{font-size:27px}#ak-bot-five .detail-links{display:grid;gap:8px;margin-top:19px}#ak-bot-five .action{display:block;padding:13px;border-radius:10px;text-align:center;background:var(--ak-ink);color:var(--ak-paper)}#ak-bot-five .action.secondary{background:var(--ak-white);color:var(--ak-ink);border:1px solid var(--ak-line)}#ak-bot-five [hidden]{display:none!important}#ak-bot-five button:focus-visible,#ak-bot-five a:focus-visible{outline:3px solid var(--ak-copper);outline-offset:3px}
    @media(max-width:360px){#ak-bot-five{padding:4px 0}#ak-bot-five .app-content{padding:12px 16px}#ak-bot-five h2{font-size:26px}#ak-bot-five .composer{gap:7px;padding:10px}#ak-bot-five .menu-launch{padding:10px;font-size:12px}}
  </style><style>#ak-bot-five{padding:0;max-width:480px;margin:auto;min-height:100vh;background:#173a2c;color:#eef3e9;--ak-paper:#163326;--ak-white:#214632;--ak-ink:#eff4ea;--ak-muted:#bdcbbf;--ak-copper:#d6aa7e;--ak-line:#47614e;--tg-header:#143124}#ak-bot-five .app{background:radial-gradient(ellipse at 100% 25%,#8b714333,transparent 60%),linear-gradient(145deg,#143426,#234a35)}#ak-bot-five .app-content{padding:20px 22px 26px}#ak-bot-five .app-menu .cta{background:#e9efe4;color:#173a2c}#ak-bot-five .action{background:#e9efe4;color:#173a2c}#ak-bot-five .action.secondary{background:#214632;color:#eff4ea}body{margin:0;background:#163326;font-family:Arial,sans-serif}#ak-bot-five .bar{padding-top:max(12px,env(safe-area-inset-top))}#ak-bot-five .quiet{padding-bottom:env(safe-area-inset-bottom)}</style></head><body><div id="ak-bot-five"><div id="ak-app" class="app">
      <div class="bar"><div><strong>Меню</strong><small>Алексей Кравцов</small></div><button class="close" id="ak-close" aria-label="Закрыть мини-приложение">Закрыть</button></div>
      <div class="app-content">
        <div id="ak-app-home"><div class="wordmark">Алексей<br>Кравцов</div><div class="eyebrow">Для собственников и CEO</div><h2>Психология решений</h2><p>Помогаю разобраться в решении и определить следующий шаг.</p><div class="credentials">20 лет управленческой практики<br>Магистр психологии НИУ ВШЭ</div>
          <div class="app-menu"><button data-section="work"><span>Работа со мной<small>Подход, формат и стоимость</small></span><span aria-hidden="true">↗</span></button><button data-section="situations"><span>С чем можно прийти?<small>Решение, контроль, партнёрство, переход</small></span><span aria-hidden="true">↗</span></button><button data-section="change"><span>Что может измениться?<small>Ясность, выбор и следующий шаг</small></span><span aria-hidden="true">↗</span></button><button data-section="trust"><span>Опыт и отзывы<small>Квалификация и опыт клиентов</small></span><span aria-hidden="true">↗</span></button><button class="cta" data-section="booking">Записаться на встречу</button></div>
          <div class="quiet"><button data-section="more">Материалы и другое</button><button data-section="contact">Написать Алексею</button></div>
        </div>
        <div id="ak-detail" class="detail" hidden><button class="back" id="ak-back">← Главное меню</button><div class="eyebrow" id="ak-question"></div><h2 id="ak-detail-title"></h2><div id="ak-detail-body"></div><div class="detail-links" id="ak-detail-links"></div></div>
      </div>
    </div>
<script>
    (()=>{const root=document.getElementById('ak-bot-five');const el=id=>root.querySelector('#'+id);const screens={
      work:{question:'Что предлагается?',title:'Работа со мной',body:['Индивидуальная психологическая работа с решениями в бизнесе. Вместе исследуем ситуацию и то, что мешает вам действовать.','Основной рабочий цикл: 10 встреч по 50 минут. Стоимость сессии: 8 000 ₽. Оплата двумя блоками по пять встреч.'],links:[['Подход и работа','https://alekseykravtsov.ru/method/'],['Формат и условия','https://alekseykravtsov.ru/terms/']]},
      situations:{question:'Кому и в каких ситуациях?',title:'С чем можно прийти?',body:['Собственникам и CEO, когда решение откладывается, контроль не отпускает, с партнёром трудно говорить или прежняя роль стала тесной.','Рабочий запрос начинается с конкретного затруднения. Его уточняем вместе на встрече.'],links:[['Ситуации в бизнесе','https://alekseykravtsov.ru/business-psychologist/']]},
      change:{question:'Что может дать работа?',title:'Что может измениться?',body:['Увидеть препятствие, разобраться в доступных вариантах и определить следующий шаг.','Это цель работы. Изменения зависят от вашей ситуации; сроки и финансовые результаты не гарантируются.'],links:[['Смотреть кейсы','https://alekseykravtsov.ru/cases/']]},
      trust:{question:'Почему можно доверять?',title:'Опыт и отзывы',body:['20 лет управленческой и предпринимательской практики. Магистр психологии НИУ ВШЭ.','Квалификация, биография и отзывы доступны на сайте. Отзывы опубликованы с разрешения авторов.'],links:[['Отзывы на сайте','https://alekseykravtsov.ru/reviews/'],['Квалификация','https://alekseykravtsov.ru/qualification/'],['Биография','https://alekseykravtsov.ru/about/']]},
      booking:{question:'Какой следующий шаг?',title:'Начать с вашей ситуации',body:['Диагностическая встреча: 30 минут, онлайн. Знакомимся, уточняем ситуацию и проверяем, подходит ли вам формат работы.','Выберите время или сначала напишите мне лично.'],links:[['Выбрать время','https://cal.com/kravtsovav'],['Написать Алексею','https://t.me/AlekseyKravtsov']]},
      more:{question:'Продолжить знакомство',title:'Материалы и другое',body:[],links:[['Telegram-канал','https://t.me/kravtsov_av_BP'],['Статьи','https://alekseykravtsov.ru/articles/'],['Материалы','https://alekseykravtsov.ru/materials/'],['Публикации в СМИ','https://alekseykravtsov.ru/publications/'],['Конфиденциальность','https://alekseykravtsov.ru/privacy.html']]},
      contact:{question:'Личный контакт',title:'Написать Алексею',body:['Можно начать с короткого описания того, что сейчас затрудняет решение.'],links:[['Открыть личный Telegram','https://t.me/AlekseyKravtsov']]}
    };const showApp=()=>{el('ak-app').hidden=false;};const home=()=>{showApp();el('ak-app-home').hidden=false;el('ak-detail').hidden=true;};const detail=key=>{const x=screens[key];showApp();el('ak-app-home').hidden=true;el('ak-detail').hidden=false;el('ak-question').textContent=x.question;el('ak-detail-title').textContent=x.title;el('ak-detail-body').replaceChildren(...x.body.map(t=>{const p=document.createElement('p');p.textContent=t;return p;}));el('ak-detail-links').replaceChildren(...x.links.map(([label,url],i)=>{const a=document.createElement('a');a.className='action'+(i?' secondary':'');a.textContent=label+' ↗';a.href=url;a.target='_blank';a.rel='noopener';a.addEventListener('click',e=>{if(window.Telegram?.WebApp?.initData){e.preventDefault();if(url.startsWith('https://t.me/'))window.Telegram.WebApp.openTelegramLink(url);else window.Telegram.WebApp.openLink(url);}});return a;}));};root.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>detail(b.dataset.section)));el('ak-back').addEventListener('click',home);el('ak-close').addEventListener('click',()=>{if(window.Telegram?.WebApp?.initData){window.Telegram.WebApp.close();}else{home();}}); window.Telegram?.WebApp?.ready(); window.Telegram?.WebApp?.expand();})();
  </script></div></body></html>
